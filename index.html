<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Fair Sky Network</title>
<style>
  :root { --navy:#0A1F44; --deep:#060F24; --cream:#F5EFE6; --sunrise:#F28C28; --muted:#8FA0BC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: linear-gradient(180deg, #060B1A 0%, #0A1F44 55%, #1C4D8F 85%, #6FA7D6 97%, #F4D6B0 100%);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 24px; overflow:hidden;
  }
  .glow { position:fixed; left:50%; bottom:-42vh; width:140vw; height:70vh; transform:translateX(-50%);
    background: radial-gradient(closest-side, rgba(242,140,40,0.28), rgba(242,140,40,0.08) 55%, transparent 75%);
    pointer-events:none; }
  .horizon { position:fixed; left:0; right:0; bottom:12vh; height:2px;
    background: linear-gradient(90deg, transparent, rgba(242,140,40,0.75), transparent); }
  main { position:relative; }
  .mark { font-size: clamp(40px, 7vw, 84px); font-weight: 700; letter-spacing: 0.14em; line-height:1.05; }
  .net { display:block; font-size: clamp(14px, 2.2vw, 24px); font-weight:500; letter-spacing: 0.55em;
    color: var(--sunrise); margin-top: 14px; padding-left: 0.55em; }
  .line { margin: 56px auto 0; font-size: clamp(17px, 2.4vw, 26px); color: var(--cream); font-weight: 500; }
  .sub { margin-top: 12px; font-size: clamp(13px, 1.7vw, 17px); color: var(--muted); font-style: italic; }
  @media (prefers-reduced-motion: no-preference) {
    .line, .sub { opacity:0; animation: rise 0.9s ease-out forwards; }
    .sub { animation-delay: 0.35s; }
    @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none; } }
  }
</style>
</head>
<body>
<div class="glow"></div><div class="horizon"></div>
<main>
  <div class="mark">FAIR SKY<span class="net">NETWORK</span></div>
  <div class="line">Something's coming.</div>
  <div class="sub">Clear skies for aerospace material.</div>
</main>
</body>
</html>
