<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Fair Sky Network</title>
<style>
  :root { --navy:#0A1F44; --deep:#060F24; --cream:#F5EFE6; --sunrise:#F28C28; --muted:#8FA0BC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: linear-gradient(180deg, #060B1A 0%, #0A1F44 55%, #1C4D8F 85%, #6FA7D6 100%);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 24px; overflow:hidden;
  }
  main { position:relative; }
  .mark { font-size: clamp(40px, 7vw, 84px); font-weight: 800; letter-spacing: -0.015em; line-height:1.05; display:inline-flex; align-items:center; gap:0.22em; }
  .qsun { height: 0.78em; width: 0.78em; display:block; }
  .net { display:block; font-size: clamp(14px, 2.2vw, 24px); font-weight:500; letter-spacing: 0.55em;
    color: var(--sunrise); margin-top: 14px; padding-left: 0.55em; }
  .line { margin: 56px auto 0; font-size: clamp(17px, 2.4vw, 26px); color: var(--cream); font-weight: 500; }
  .sub { margin-top: 12px; font-size: clamp(13px, 1.7vw, 17px); color: var(--muted); font-style: italic; }
  @media (prefers-reduced-motion: no-preference) {
    .line, .sub { opacity:0; animation: rise 0.9s ease-out forwards; }
    .sub { animation-delay: 0.35s; }
    @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none; } }
  }
</style>
</head>
<body>
<main>
  <div class="mark"><svg class="qsun" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 100 A100 100 0 0 1 100 0 L100 100 Z" fill="currentColor"/></svg>FairSky<span class="net">NETWORK</span></div>
  <div class="line">Something's coming.</div>
  <div class="sub">Prove authenticity. Verify in seconds.</div>
</main>
</body>
</html>
